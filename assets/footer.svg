<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Thanks for stopping by!">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace; }
      .sans { font-family: 'Segoe UI',Inter,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif; }
      .floor { animation: floor 1.6s linear infinite; }
      @keyframes floor { from { transform: translateY(0); } to { transform: translateY(-24px); } }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      .twinkle:nth-child(2n) { animation-delay: 1s; } .twinkle:nth-child(3n) { animation-delay: 2s; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A18"/>
      <stop offset=".45" stop-color="#0A1633"/>
      <stop offset="1" stop-color="#050A18"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3F2FD"/>
      <stop offset=".35" stop-color="#64B5F6"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset=".65" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#E3F2FD"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ceilFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <mask id="ceilMask"><rect x="0" y="0" width="1200" height="70" fill="url(#ceilFade)"/></mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E3A6E"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="220" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <rect y="70" width="1200" height="150" fill="url(#dots)" opacity=".5"/>

    <g fill="#BBDEFB">
      <circle class="twinkle" cx="120" cy="120" r="1.3"/>
      <circle class="twinkle" cx="260" cy="180" r="1"/>
      <circle class="twinkle" cx="1060" cy="110" r="1.4"/>
      <circle class="twinkle" cx="960" cy="186" r="1"/>
      <circle class="twinkle" cx="1140" cy="170" r="1.1"/>
    </g>

    <!-- mirrored grid ceiling -->
    <g mask="url(#ceilMask)" stroke="#1E88E5" stroke-width="1.2" fill="none">
      <g class="floor">
        <line x1="0" y1="10" x2="1200" y2="10"/>
        <line x1="0" y1="34" x2="1200" y2="34"/>
        <line x1="0" y1="58" x2="1200" y2="58"/>
        <line x1="0" y1="82" x2="1200" y2="82"/>
      </g>
      <path d="M600 70 L-600 -40 M600 70 L-200 -40 M600 70 L100 -40 M600 70 L350 -40 M600 70 L600 -40 M600 70 L850 -40 M600 70 L1100 -40 M600 70 L1400 -40 M600 70 L1800 -40"/>
    </g>
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#42A5F5" stroke-width="1.5" opacity=".8" filter="url(#glow)"/>

    <text x="600" y="160" text-anchor="middle" class="sans" font-size="48" font-weight="800" letter-spacing="1" fill="url(#name)" filter="url(#glow)">Thanks for stopping by!</text>

    <rect width="1200" height="220" rx="18" fill="none" stroke="#1E3A6E" stroke-width="2"/>
  </g>
</svg>
